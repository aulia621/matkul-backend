<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Makanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Tambah Data Makanan</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group mb-3">
                <label for="kode_makanan">Kode Makanan :</label>
                <input type="text" name="kode_makanan" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="nama_makanan">Nama Makanan :</label>
                <input type="text" name="nama_makanan" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="kategori">Kategori :</label>
                <input type="text" name="kategori" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="harga">Harga :</label>
                <input type="number" name="harga" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="stok">Stok :</label>
                <input type="number" name="stok" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="file" class="form-label">Upload Gambar Makanan</label>
                <input type="file" class="form-control" id="file" name="file" required>
            </div>
            <button type="submit" class="btn btn-success">Simpan</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Kembali</a>
        </form>
    </div>
</body>
</html>
