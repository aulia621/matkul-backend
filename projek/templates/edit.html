<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data Makanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Edit Data Makanan</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group mb-3">
                <label for="kode_makanan">Kode Makanan :</label>
                <input type="text" name="kode_makanan" class="form-control" value="{{ file[0] }}" required>
            </div>

            <div class="form-group mb-3">
                <label for="nama_makanan">Nama Makanan :</label>
                <input type="text" name="nama_makanan" class="form-control" value="{{ file[1] }}" required>
            </div>

            <div class="form-group mb-3">
                <label for="kategori">Kategori :</label>
                <input type="text" name="kategori" class="form-control" value="{{ file[2] }}" required>
            </div>

            <div class="form-group mb-3">
                <label for="harga">Harga :</label>
                <input type="number" name="harga" class="form-control" value="{{ file[3] }}" required>
            </div>

            <div class="form-group mb-3">
                <label for="stok">Stok :</label>
                <input type="number" name="stok" class="form-control" value="{{ file[4] }}" required>
            </div>

            <div class="mb-3">
                <label for="file" class="form-label">Gambar Makanan (opsional)</label>
                <input type="file" class="form-control" id="file" name="file">
                <p class="mt-2">Gambar saat ini:</p>
                <img src="{{ url_for('uploaded_file', filename=file[5]) }}" width="150">
            </div>

            <button type="submit" class="btn btn-warning">Update</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Kembali</a>
        </form>
    </div>
</body>
</html>
