<!DOCTYPE html>
<html>
<head>
    <title>CRUD Flask</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-3">Daftar Barang UMKM</h2>

    <a href="/add" class="btn btn-primary mb-3">Tambah Barang</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Kode Barang</th>
            <th>Nama Barang</th>
            <th>Harga Barang</th>
            <th>Jumlah Stok</th>
            <th>Aksi</th>
        </tr>
        </thead>
        <tbody>
            {% for u in stoks %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.kode }}</td>
                <td>{{ u.nama }}</td>
                <td>{{ u.harga }}</td>
                <td>{{ u.jumlah }}</td>
                <td>
                <a href="/edit/{{ u.id }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="/delete/{{ u.id }}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Yakin ingin menghapus?')">
                   Delete
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
        </table>
        </div>
    </body>
    </html>
